name: Quality

on:
  push:
    branches:
      - main
  pull_request:

  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for release
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.0"
          - "8.2"
          - "8.4"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-lock

      - name: Install development dependencies
        run: composer install --no-progress --no-interaction

      - name: Lint PHP
        run: composer lint

      - name: Run unit tests
        run: composer test

      - name: Build installable package
        run: ./build.sh
