<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">WP Adverts &lt;&gt; ARMember</title>
  <desc id="desc">Repository social preview for the WP Adverts to ARMember integration plugin.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071c4d"/>
      <stop offset="1" stop-color="#0a2f6b"/>
    </linearGradient>
    <linearGradient id="glow" x1="240" y1="120" x2="620" y2="560" gradientUnits="userSpaceOnUse">
